<title>ABCL × IOVA Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: SaaS research console. Fixed left sidebar + dense card grid; price charts with event markers, thin segment bars, ranked lists, heatmaps. ABCL teal, IOVA orange, XBI grey. */
:root{
  --bg:#f6f6f7; --panel:#ffffff; --side:#fbfbfb; --line:#e6e6e9; --line2:#f1f1f3;
  --fg:#17171b; --fg2:#53545c; --muted:#8b8c94; --chip:#f2f2f4;
  --abcl:#0f9f8e; --iova:#e5780b; --xbi:#8b8c94; --up:#15a34a; --down:#dc2626; --warn:#c77700; --blue:#3866e0; --violet:#7c5cd6;
  --tip-bg:#17171b; --tip-fg:#ffffff;
  --f:'Geist','Noto Sans KR',system-ui,-apple-system,sans-serif;
  --fm:'Geist Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0f11; --panel:#16171a; --side:#121315; --line:#26272c; --line2:#1d1e22;
  --fg:#ececef; --fg2:#a8a9b1; --muted:#73747c; --chip:#212226;
  --abcl:#2cc5b1; --iova:#ff9a3a; --xbi:#8a8b93; --up:#2fd06b; --down:#ff6b6b; --warn:#f2b33d; --blue:#7ea0ff; --violet:#a68cff;
  --tip-bg:#ececef; --tip-fg:#16171a;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e0f11; --panel:#16171a; --side:#121315; --line:#26272c; --line2:#1d1e22;
  --fg:#ececef; --fg2:#a8a9b1; --muted:#73747c; --chip:#212226;
  --abcl:#2cc5b1; --iova:#ff9a3a; --xbi:#8a8b93; --up:#2fd06b; --down:#ff6b6b; --warn:#f2b33d; --blue:#7ea0ff; --violet:#a68cff;
  --tip-bg:#ececef; --tip-fg:#16171a;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 13px/1.55 var(--f);padding-inline:0;padding-block:0}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
.n{font-family:var(--fm);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:2px 8px;white-space:nowrap;flex:none}
.logo i{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--abcl),var(--iova));display:block}
.nav{display:grid;gap:2px}
.nav button{all:unset;display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--fg2);cursor:pointer;font-size:13px}
.nav button:hover{background:var(--chip);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--chip);color:var(--fg);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.nav svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.sgroup{font-size:11px;color:var(--muted);padding:0 10px;margin-bottom:4px;display:flex;justify-content:space-between}
.tk{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 10px;border-radius:8px;font-size:12.5px}
.tk b{display:flex;align-items:center;gap:7px}
.tk b::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.side .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:0 10px}
.main{min-width:0;padding:18px 24px 40px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
.asof{font-size:12px;color:var(--muted)}
.top .sp{flex:1}
.pillset{display:flex;gap:6px;flex-wrap:wrap}
.pillset span{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--fg2)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.s2{grid-column:span 2} .s3{grid-column:span 3} .sa{grid-column:1/-1}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.s3{grid-column:1/-1}}
@media(max-width:700px){.g4,.g3,.g2{grid-template-columns:minmax(0,1fr)}.s2,.s3{grid-column:auto}}
.mt{margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ch h3{font-size:13px;font-weight:600;margin:0}
.ch .more{font-size:11.5px;color:var(--muted);white-space:nowrap}
section[hidden]{display:none}
.kpi{display:grid;gap:2px;min-width:0}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .v{font:500 20px/1.2 var(--fm);letter-spacing:-.01em}
.kpi .d{font-size:11.5px;color:var(--fg2)}
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 18px}
@media(max-width:560px){.kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.up{color:var(--up)} .down{color:var(--down)}
.delta{font:500 11px var(--fm);padding:1px 6px;border-radius:5px;background:var(--chip);white-space:nowrap}
.delta.up{background:color-mix(in srgb,var(--up) 12%,transparent)}
.delta.down{background:color-mix(in srgb,var(--down) 12%,transparent)}
.rl{list-style:none;margin:0;padding:0;display:grid}
.rl li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;padding:7px 0;border-top:1px solid var(--line2);align-items:start}
.rl li:first-child{border-top:0}
.rl .i{color:var(--muted);font:500 11.5px var(--fm);padding-top:1px}
.rl .x small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.rl .r{font:500 12px var(--fm);text-align:right;white-space:nowrap}
.segrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:12.5px;padding:3px 0}
.segrow .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:7px}
.seg{display:flex;height:6px;border-radius:99px;overflow:hidden;gap:2px;background:var(--line2)}
.seg i{display:block;height:100%;background:var(--c)}
.hb{display:grid;gap:8px}
.hbr{display:grid;grid-template-columns:minmax(80px,120px) minmax(24px,1fr) 52px;gap:10px;align-items:center;font-size:12px}
.hbr .lb{color:var(--fg2)}
.hbr .tr{height:8px;background:var(--line2);border-radius:99px;position:relative}
.hbr .tr i{position:absolute;top:0;bottom:0;left:0;border-radius:99px;background:var(--c)}
.hbr .vv{font:500 12px var(--fm);text-align:right}
@media(max-width:520px){.hbr{grid-template-columns:90px minmax(0,1fr) 56px}}
.vbars{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:16px;border-bottom:1px solid var(--line)}
.vb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.vb i{display:block;width:100%;max-width:44px;border-radius:6px 6px 2px 2px;background:var(--c)}
.vb i.est{background:repeating-linear-gradient(135deg,var(--c) 0 4px,transparent 4px 7px);border:1px solid var(--c)}
.vb span{font:500 11.5px var(--fm)}
.vlab{display:flex;gap:14px}.vlab span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.wf{display:grid;gap:6px}
.wfr{display:grid;grid-template-columns:minmax(80px,128px) minmax(24px,1fr) 46px;gap:10px;align-items:center;font-size:12px}
.wfr .tr{height:14px;position:relative}
.wfr .tr i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--c)}
.wfr .vv{font:500 12px var(--fm);text-align:right}
@media(max-width:520px){.wfr{grid-template-columns:110px minmax(0,1fr) 60px}}
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}
th{font-weight:500;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:11.5px;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
.b{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--chip);color:var(--fg2);white-space:nowrap}
.b.ok{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent)}
.b.rep{color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.b.est{color:var(--violet);background:color-mix(in srgb,var(--violet) 12%,transparent)}
.b.mem{color:var(--muted)}
.b.unk{color:var(--down);background:color-mix(in srgb,var(--down) 10%,transparent)}
.b.clm{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.b.hi{color:var(--down);background:color-mix(in srgb,var(--down) 10%,transparent)}
.b.md{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.note{font-size:11.5px;color:var(--muted);margin:0}
p{margin:0}
.body{color:var(--fg2);font-size:12.5px}
.t{border-bottom:1px dotted var(--muted);cursor:help;position:relative;outline:none}
.t:hover::after,.t:focus::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 4px);z-index:30;width:max-content;max-width:240px;background:var(--tip-bg);color:var(--tip-fg);font:400 11.5px/1.45 var(--f);padding:6px 9px;border-radius:7px;white-space:normal;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.donut{width:120px;height:120px;border-radius:50%;flex:none;position:relative}
.donut::after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--panel)}
.dwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.rm{display:grid;grid-template-columns:28px repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(92px,auto)) 24px;gap:4px}
.rm .cell{border-radius:8px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;min-width:0}
.rm .ax{font-size:10.5px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.rm .ax.y{writing-mode:vertical-rl;transform:rotate(180deg)}
.rc{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--panel);border:1px solid var(--line);display:inline-flex;gap:5px;align-items:center}
.rc::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.ctl{display:grid;grid-template-columns:140px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:12px}
.ctl output{font:500 12px var(--fm);text-align:right}
input[type=range]{width:100%;accent-color:var(--c,var(--fg))}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.out div{background:var(--chip);border-radius:8px;padding:8px 10px}
.out small{display:block;font-size:11px;color:var(--muted)}
.out b{font:500 16px var(--fm)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns button{all:unset;font-size:11.5px;padding:3px 9px;border-radius:6px;border:1px solid var(--line);color:var(--fg2);cursor:pointer;background:var(--panel)}
.btns button:hover{color:var(--fg);border-color:var(--fg2)}
.btns button:focus-visible{outline:2px solid var(--blue)}
@media(max-width:520px){.ctl{grid-template-columns:1fr 64px}.ctl label{grid-column:1/-1}}
.tl{display:grid}
.tli{display:grid;grid-template-columns:96px 18px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line2);align-items:start}
.tli:first-child{border-top:0}
.tli .dt{font:500 11.5px var(--fm);color:var(--fg2)}
.tli .pin{width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:4px}
.tli b{font-weight:600}
.tli small{display:block;color:var(--muted);font-size:11.5px}
@media(max-width:560px){.tli{grid-template-columns:80px 14px minmax(0,1fr)}.tli>:last-child{grid-column:3}}
.quote{border-left:2px solid var(--c);padding:2px 0 2px 10px;color:var(--fg2);font-size:12.5px}
.quote small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.flt,.rng{display:flex;gap:4px;flex-wrap:wrap}
.flt button,.rng button{all:unset;font-size:11.5px;padding:3px 10px;border-radius:99px;background:var(--chip);color:var(--fg2);cursor:pointer}
.flt button[aria-pressed="true"],.rng button[aria-pressed="true"]{background:var(--fg);color:var(--panel)}
.flt button:focus-visible,.rng button:focus-visible{outline:2px solid var(--blue)}
/* charts */
.chart{position:relative;width:100%;min-height:120px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:400 10.5px var(--fm);fill:var(--muted)}
.chart .gl{stroke:var(--line2);stroke-width:1}
.chart .ax0{stroke:var(--line);stroke-width:1}
.chart .hl{stroke:var(--fg2);stroke-width:1;stroke-dasharray:3 3}
.ctip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:11.5px;box-shadow:0 8px 22px rgba(0,0,0,.12);white-space:nowrap;z-index:5;display:none}
.ctip b{font-weight:600}
.ctip .r{display:flex;gap:10px;justify-content:space-between;align-items:center}
.ctip .r span:first-child::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:6px}
.ctip .ev{margin-top:4px;color:var(--fg2);max-width:220px;white-space:normal}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg2)}
.lg span::before{content:"";display:inline-block;width:10px;height:3px;border-radius:2px;background:var(--c);margin-right:6px;vertical-align:middle}
.evl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 14px;font-size:11.5px;color:var(--fg2)}
.evl div{display:flex;gap:7px;align-items:baseline}
.evl i{font:600 10px var(--fm);font-style:normal;min-width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;background:var(--c);color:#fff;flex:none}
.evl small{color:var(--muted);font-family:var(--fm)}
.dp{position:relative;height:74px;margin:6px 6px 0}
.dp .ax{position:absolute;left:0;right:0;top:36px;height:2px;background:var(--line)}
.dp .pt{position:absolute;top:30px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--c);border:2px solid var(--panel)}
.dp .lbl{position:absolute;font:500 10.5px var(--fm);color:var(--fg2);transform:translateX(-50%);white-space:nowrap}
.dp .pr{position:absolute;top:18px;height:38px;width:2px;background:var(--fg);margin-left:-1px}
.dp .mn{position:absolute;top:26px;height:22px;width:2px;background:var(--blue);margin-left:-1px}
.hm{display:grid;gap:3px;font:500 11.5px var(--fm)}
.hm div{padding:7px 4px;text-align:center;border-radius:5px}
.hm .h{background:none;color:var(--muted);font-weight:400}
.hm .cur{outline:2px solid var(--fg);outline-offset:-2px}
.lane{display:grid;grid-template-columns:52px repeat(6,minmax(0,1fr));gap:4px;font-size:11px}
.lane .hd{color:var(--muted);text-align:center;padding:4px 0;border-bottom:1px solid var(--line)}
.lane .lb{font-weight:600;display:flex;align-items:center;gap:6px;padding-top:6px}
.lane .lb::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.lane .cellx{min-height:40px;border-left:1px dashed var(--line2);padding:4px 2px;display:flex;flex-direction:column;gap:3px}
.lane .ev{background:color-mix(in srgb,var(--c) 14%,var(--panel));border-left:3px solid var(--c);border-radius:4px;padding:3px 6px;line-height:1.3;color:var(--fg)}
.lane .ev.span{grid-row:auto}
.lane .ev.u{border-left-style:dashed}
@media(max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:8px 16px;z-index:20;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;gap:10px;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .side .grp,.side .foot{display:none}
  .nav{display:flex;gap:2px}
  .nav button{white-space:nowrap;padding:6px 9px}
  .nav svg{display:none}
  .main{padding:14px 16px 32px}
  .lane{grid-template-columns:44px repeat(6,minmax(70px,1fr))}
  .lanewrap{overflow-x:auto}
}

/* brand logos */
.logo .kd{width:22px;height:22px;border-radius:6px;background:var(--fg);color:var(--panel);display:grid;place-items:center;font:700 10px var(--fm);letter-spacing:-.02em}
.logo .nm{display:grid;line-height:1.1}
.logo .nm small{font:500 10.5px var(--f);color:var(--muted)}
.plates{display:flex;gap:10px;flex-wrap:wrap}
.plate{display:inline-flex;align-items:center;gap:10px;background:#ffffff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:6px 12px 6px 10px;height:40px}
.plate img{display:block;height:24px;width:auto}
.plate .tkr{font:600 12px var(--fm);color:#fff;background:var(--c);padding:2px 7px;border-radius:5px;letter-spacing:.02em}
.plate.sm{height:34px;padding:4px 10px 4px 8px}.plate.sm img{height:20px}
.plate[style*="--abcl"] img{height:32px}.plate.sm[style*="--abcl"] img{height:26px}

/* business view */
.def{font-size:15px;line-height:1.6;color:var(--fg)}
.def b{color:var(--c,var(--fg))}
.card .def b{font-weight:600}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts div{background:var(--chip);border-radius:8px;padding:8px 10px;min-width:0}
.facts small{display:block;font-size:11px;color:var(--muted)}
.facts b{font-size:13px;font-weight:600}
@media(max-width:560px){.facts{grid-template-columns:minmax(0,1fr)}}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px}
.st{position:relative;border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:12px 12px 10px;display:grid;gap:4px;align-content:start;min-width:0;background:var(--panel)}
.st:not(:last-child)::after{content:"";position:absolute;right:-17px;top:50%;width:12px;height:12px;border-top:2px solid var(--muted);border-right:2px solid var(--muted);transform:translateY(-50%) rotate(45deg)}
.st .sn{width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;font:600 11px var(--fm);display:grid;place-items:center}
.st b{font-size:13px;font-weight:600}
.st p{font-size:12px;color:var(--fg2)}
.st small{font-size:11px;color:var(--muted)}
@media(max-width:900px){.flow{grid-template-columns:minmax(0,1fr);gap:18px}.st:not(:last-child)::after{right:auto;left:50%;top:auto;bottom:-14px;transform:translateX(-50%) rotate(135deg)}}
.kv{display:grid}
.kv div{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--line2);font-size:12.5px}
.kv div:first-child{border-top:0}
.kv span{color:var(--muted)}
.kv b{font-weight:500}
.mf{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(70px,110px) minmax(0,1fr) minmax(56px,90px);gap:8px;align-items:center;font-size:12px}
.mrow .who{background:var(--chip);border-radius:6px;padding:5px 8px;text-align:center;font-weight:600}
.mrow .arr{position:relative;display:grid;place-items:center;min-height:30px}
.mrow .arr i{position:absolute;left:0;right:8px;top:50%;height:2px;background:var(--c)}
.mrow .arr::after{content:"";position:absolute;right:0;top:50%;border:6px solid transparent;border-left:8px solid var(--c);transform:translateY(-50%)}
.mrow .arr em{position:relative;font-style:normal;background:var(--panel);padding:0 6px;color:var(--fg2);text-align:center;font-size:11.5px}
table.cmp td:first-child{color:var(--muted);white-space:nowrap}

/* swot */
.swg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(max-width:560px){.swg{grid-template-columns:minmax(0,1fr)}}
.swq{border-radius:10px;padding:10px 12px;background:color-mix(in srgb,var(--q) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--q) 25%,var(--line));min-width:0}
.swh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.swl{width:22px;height:22px;border-radius:6px;background:var(--q);color:#fff;font:700 12px var(--fm);display:grid;place-items:center;align-self:center}
.swh b{font-size:13px}.swh small{font-size:11px;color:var(--muted)}
.swq ol{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.swq li{font-size:12.5px;line-height:1.4}
.swq li small{display:block;color:var(--fg2);font-size:11.5px;margin-top:1px}
</style>

const startIdx=()=>RANGE==='YTD'?IYTD:Math.max(0,N-RANGES.find(r=>r[0]===RANGE)[1]);
function niceTicks(lo,hi,n){const span=hi-lo,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),err=step0/mag,step=(err>=7.5?10:err>=3.5?5:err>=1.5?2:1)*mag,out=[];for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step)out.push(+v.toFixed(6));return out}
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function lineChart(host,cfg){
  const W=Math.max(300,host.clientWidth),H=cfg.h||250,L=46,R=12,Tp=16,VH=cfg.vol?50:0,Bt=22;
  const i0=cfg.i0??startIdx(),i1=LAST,cnt=Math.max(1,i1-i0);
  const PW=W-L-R,PH=H-Tp-Bt-VH;
  const X=i=>L+(i-i0)/cnt*PW;
  const ser=cfg.series.map(s=>({...s,v:cfg.idx?s.vals.map(x=>x/s.vals[i0]*100):s.vals}));
  let lo=Infinity,hi=-Infinity;ser.forEach(s=>{for(let i=i0;i<=i1;i++){const v=s.v[i];if(v<lo)lo=v;if(v>hi)hi=v}});
  if(cfg.refs)cfg.refs.forEach(r=>{if(r.v>hi)hi=r.v;if(r.v<lo)lo=r.v});
  const pd=(hi-lo)*.08||1;lo-=pd;hi+=pd+(cfg.events?(hi-lo)*.18:0);if(!cfg.idx&&lo<0)lo=0;
  const Y=v=>Tp+(1-(v-lo)/(hi-lo))*PH;
  const fmt=cfg.idx?(v=>v.toFixed(0)):(v=>'$'+(v>=100?v.toFixed(0):v.toFixed(v<10?2:1)));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${cfg.aria||'가격 차트'}"><defs>${ser.map((x,k)=>`<linearGradient id="${host.id}g${k}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${css(x.cv)}" stop-opacity=".22"/><stop offset="1" stop-color="${css(x.cv)}" stop-opacity="0"/></linearGradient>`).join('')}</defs>`;
  niceTicks(lo,hi,4).forEach(t=>{s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L-6}" y="${Y(t)+3.5}" text-anchor="end">${cfg.idx?t.toFixed(0):fmt(t)}</text>`});
  if(cfg.idx)s+=`<line class="ax0" x1="${L}" x2="${W-R}" y1="${Y(100)}" y2="${Y(100)}" stroke-dasharray="4 3"/>`;
  const nx=W<520?3:5;for(let k=0;k<=nx;k++){const i=Math.round(i0+k/nx*cnt),d=D[i];s+=`<text x="${X(i)}" y="${H-6}" text-anchor="${k===0?'start':k===nx?'end':'middle'}">${cnt<70?d.slice(5).replace('-','/'):d.slice(2,7).replace('-','.')}</text>`}
  if(cfg.refs)cfg.refs.forEach(r=>{s+=`<line x1="${L}" x2="${W-R}" y1="${Y(r.v)}" y2="${Y(r.v)}" stroke="${css(r.cv)}" stroke-width="1" stroke-dasharray="2 4"/><text x="${W-R}" y="${Y(r.v)-4}" text-anchor="end" style="fill:${css(r.cv)}">${r.label}</text>`});
  ser.forEach((x,k)=>{let p='';for(let i=i0;i<=i1;i++)p+=(i===i0?'M':'L')+X(i).toFixed(1)+' '+Y(x.v[i]).toFixed(1);
    if(cfg.area&&k===0)s+=`<path d="${p}L${X(i1)} ${Tp+PH}L${X(i0)} ${Tp+PH}Z" fill="url(#${host.id}g0)"/>`;
    s+=`<path d="${p}" fill="none" stroke="${css(x.cv)}" stroke-width="${x.w||2}" stroke-linejoin="round" ${x.dash?'stroke-dasharray="4 3"':''}/>`;
    s+=`<circle cx="${X(i1)}" cy="${Y(x.v[i1])}" r="3.5" fill="${css(x.cv)}"/>`});
  if(cfg.vol){const vv=cfg.vol.vals.slice(i0,i1+1),mx=Math.max(...vv)||1,bw=Math.max(1,PW/cnt*.7),y0=H-Bt;
    for(let i=i0;i<=i1;i++){const h=(cfg.vol.vals[i]/mx)*(VH-10);s+=`<rect x="${X(i)-bw/2}" y="${y0-h}" width="${bw}" height="${h}" fill="${css(cfg.vol.cv)}" opacity=".28"/>`}
    s+=`<text x="${L-6}" y="${H-Bt-VH+16}" text-anchor="end">거래량</text>`}
  const evs=(cfg.events||[]).map((e,k)=>({...e,i:idx(e[0]),n:k+1})).filter(e=>e.i>=i0&&D[e.i]<=D[LAST]);
  let px=-99,lv=0;evs.forEach(e=>{const cx=X(e.i),cy=Y(ser[0].v[e.i]);lv=cx-px<18?lv+1:0;px=cx;const by=Math.max(Tp+2,cy-15-lv*18);s+=`<line x1="${cx}" x2="${cx}" y1="${by+8}" y2="${Tp+PH}" stroke="${css(ser[0].cv)}" stroke-opacity=".25"/><circle cx="${cx}" cy="${by}" r="8" fill="${css(ser[0].cv)}" stroke="${css('--panel')}" stroke-width="1.5"/><text x="${cx}" y="${by+3.5}" text-anchor="middle" style="fill:#fff;font-weight:600">${e.n}</text>`});
  s+=`<line class="hl" id="${host.id}h" x1="0" x2="0" y1="${Tp}" y2="${Tp+PH}" style="display:none"/>${ser.map((x,k)=>`<circle id="${host.id}d${k}" r="4" fill="${css(x.cv)}" stroke="${css('--panel')}" stroke-width="2" style="display:none"/>`).join('')}<rect x="${L}" y="${Tp}" width="${PW}" height="${PH+VH}" fill="transparent" id="${host.id}o"/></svg><div class="ctip" id="${host.id}t"></div>`;
  host.innerHTML=s;
  const o=$('#'+host.id+'o'),tip=$('#'+host.id+'t'),hl=$('#'+host.id+'h');
  const move=ev=>{const r=o.getBoundingClientRect(),sc=PW/r.width,mx=(ev.clientX-r.left)*sc;const i=Math.min(i1,Math.max(i0,Math.round(i0+mx/PW*cnt)));
    hl.setAttribute('x1',X(i));hl.setAttribute('x2',X(i));hl.style.display='';
    ser.forEach((x,k)=>{const d=$('#'+host.id+'d'+k);d.setAttribute('cx',X(i));d.setAttribute('cy',Y(x.v[i]));d.style.display=''});
    const e=evs.find(e=>e.i===i);
    tip.innerHTML=`<b>${D[i]}</b>`+ser.map(x=>`<div class="r" style="--c:${css(x.cv)}"><span>${x.name}</span><span class="n">${cfg.idx?x.v[i].toFixed(1):'$'+x.v[i].toFixed(2)}</span></div>`).join('')+(cfg.vol?`<div class="r"><span style="color:var(--muted)">거래량</span><span class="n">${cfg.vol.vals[i].toFixed(1)}M</span></div>`:'')+(e?`<div class="ev">${e.n}. ${e[1]}</div>`:'');
    tip.style.display='block';const hostR=host.getBoundingClientRect(),px=X(i)/sc;tip.style.left=Math.min(hostR.width-tip.offsetWidth-4,Math.max(4,px+12))+'px';tip.style.top='8px'};
  o.addEventListener('mousemove',move);o.addEventListener('touchmove',e=>{move(e.touches[0])},{passive:true});
  o.addEventListener('mouseleave',()=>{tip.style.display='none';hl.style.display='none';ser.forEach((x,k)=>$('#'+host.id+'d'+k).style.display='none')});
}

/* VALUATION */
function rnpv(peak,m,pos,r,ph3){let v=0,cost=0;const tax=.15,t0=2026.75;for(let y=2027;y<=2029;y++)cost+=ph3/3/Math.pow(1+r,y+.5-t0);for(let y=2030;y<=2041;y++){const ramp=Math.min(1,(y-2029)*.2);v+=peak*1000*ramp*m*(1-tax)/Math.pow(1+r,y+.5-t0)}return v*pos-cost}
const hmColor=(v,p)=>{const r=v/p-1,a=Math.min(60,Math.abs(r)*60);return `background:color-mix(in srgb,var(${r>=0?'--up':'--down'}) ${a.toFixed(0)}%,var(--panel))`};
function heatA(){const peaks=[1,1.5,2,3,4,5],pos=[40,50,60,70,80];let h=`<div class="hm" style="grid-template-columns:64px repeat(${pos.length},minmax(0,1fr))"><div class="h">피크 \\ 확률</div>${pos.map(p=>`<div class="h">${p}%</div>`).join('')}`;
  peaks.forEach(pk=>{h+=`<div class="h">$${pk}B</div>`+pos.map(p=>{const v=(rnpv(pk,.4,p/100,.10,350)+AB.cash+500)/AB.fd;return `<div class="${pk===1.5&&p===60?'cur':''}" style="${hmColor(v,P.abcl)}">$${v.toFixed(1)}</div>`}).join('')});return h+'</div>'}
function heatI(){const revs=[500,580,650,750,850],mul=[5,7,9,11,13];let h=`<div class="hm" style="grid-template-columns:64px repeat(${mul.length},minmax(0,1fr))"><div class="h">매출 \\ 배수</div>${mul.map(m=>`<div class="h">${m}x</div>`).join('')}`;
  revs.forEach(rv=>{h+=`<div class="h">$${rv}M</div>`+mul.map(m=>{const sh=IO.sh+150/P.iova,v=(rv*m+IO.cash+150)/sh;return `<div class="${rv===580&&m===7?'cur':''}" style="${hmColor(v,P.iova)}">$${v.toFixed(1)}</div>`}).join('')});return h+'</div>'}

  <li><span class="i">4</span><span class="x">ABCL 9/30 현금<small>$565.1M + 증자 순수입 ~$187M + Vertex $28M − 3Q 소진 ~$50M ≈ ${fmtB(AB.cash)}</small></span><span class="r"></span></li>
  <li><span class="i">5</span><span class="x">ABCL 런웨이<small>3상 없이 $200M/년 → 4.2년, 3상 포함 ~$315M/년 → 2.7년</small></span><span class="r"></span></li>
  <li><span class="i">6</span><span class="x">IOVA EV<small>452.97M × 현재가 − $303.7M(6/30)</small></span><span class="r"></span></li>
  <li><span class="i">7</span><span class="x">한계<small>3분기 실제 현금·주식 수는 11/6, 11/9 실적에서 확인 필요</small></span><span class="r"></span></li></ol>`)}
</div>`,()=>{}]);

/* ---------- render ---------- */
const nav=$('#nav'),views=$('#views');
V.forEach(([id,label,ic,fn,draw])=>{
  const b=document.createElement('button');b.innerHTML=`<svg viewBox="0 0 24 24">${ICON[ic]}</svg>${label}`;b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b);
  const s=document.createElement('section');s.id='v-'+id;s.hidden=true;s.innerHTML=fn();views.appendChild(s);CH[id]=draw;
});
let CUR='overview';
function draw(){CH[CUR]&&CH[CUR]();document.querySelectorAll('[data-rng] button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===RANGE))}
function show(id){CUR=id;V.forEach(([v])=>{$('#v-'+v).hidden=v!==id});
  [...nav.children].forEach(b=>{if(b.dataset.id===id)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  try{localStorage.setItem('abiova-view',id)}catch(e){}
  window.scrollTo(0,0);requestAnimationFrame(draw)}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();show(g.dataset.go);return}const b=e.target.closest('[data-rng] button');if(b){RANGE=b.dataset.r;try{localStorage.setItem('abiova-rng',RANGE)}catch(x){}draw()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,150)});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',draw);

/* header / watchlist */
$('#asof').textContent=`${lastDate} 종가 · 2Q26 10-Q · 2026-10-08 갱신`;
$('#wlDate').textContent=lastDate.slice(5).replace('-','/')+' 종가';
[['A','abcl'],['I','iova'],['X','xbi']].forEach(([s,k])=>{$('#wl'+s).textContent='$'+P[k].toFixed(2);const r=ret(k,I930);$('#wl'+s+'d').innerHTML=`<span class="${r>=0?'up':'down'}" style="font:500 11px var(--fm)">${r>=0?'+':''}${r.toFixed(1)}%</span>`});

/* calendar */
let cf='all';
function renderCal(){$('#cf').innerHTML=[['all','전체'],['a','ABCL'],['i','IOVA']].map(f=>`<button aria-pressed="${cf===f[0]}" data-f="${f[0]}">${f[1]}</button>`).join('');
  [...$('#cf').children].forEach(b=>b.onclick=()=>{cf=b.dataset.f;renderCal()});
  $('#tl').innerHTML=CAL.filter(c=>cf==='all'||c.tk===cf).map(tlRow).join('')}
renderCal();
(function(){const cols=['4Q26','1Q27','2Q27','3Q27','4Q27','2028+'];let h=`<div></div>${cols.map(c=>`<div class="hd">${c}</div>`).join('')}`;
  [['a','ABCL','--abcl'],['i','IOVA','--iova']].forEach(([k,n,cv])=>{
    const evs=CAL.filter(c=>c.tk===k);
    const rows=[];evs.forEach(e=>{const [s,t]=Array.isArray(e.col)?e.col:[e.col,e.col];let r=rows.findIndex(row=>row.every(x=>t<x[0]||s>x[1]));if(r<0){rows.push([]);r=rows.length-1}rows[r].push([s,t,e])});
    rows.forEach((row,ri)=>{h+=`<div class="lb" style="--c:var(${cv})">${ri===0?n:''}</div>`;let c=1;row.sort((a,b)=>a[0]-b[0]).forEach(([s,t,e])=>{if(s>c)h+=`<div class="cellx" style="grid-column:span ${s-c}"></div>`;h+=`<div class="cellx" style="grid-column:span ${t-s+1};--c:var(${cv})"><div class="ev ${e.u?'u':''}" style="--c:var(${cv})">${e.t}<br><small style="color:var(--muted)">${e.d}</small></div></div>`;c=t+1});if(c<=6)h+=`<div class="cellx" style="grid-column:span ${7-c}"></div>`});
  });
  $('#lane').innerHTML=h})();

/* valuation calculators */
function calcA(){const peak=+$('#a1').value,m=+$('#a2').value/100,pos=+$('#a3').value/100,r=+$('#a4').value/100,ph3=+$('#a5').value,oth=+$('#a6').value*1000;
  $('#o1').textContent='$'+peak.toFixed(1)+'B';$('#o2').textContent=Math.round(m*100)+'%';$('#o3').textContent=Math.round(pos*100)+'%';$('#o4').textContent=Math.round(r*100)+'%';$('#o5').textContent='$'+ph3+'M';$('#o6').textContent='$'+(oth/1000).toFixed(2)+'B';
  const x=rnpv(peak,m,pos,r,ph3),ps=(x+AB.cash+oth)/AB.fd;
  $('#aout').innerHTML=`<div><small>ABCL635 rNPV</small><b>${fmtB(x)}</b></div><div><small>+ 현금 + 기타</small><b>${fmtB(AB.cash+oth)}</b></div><div><small>주당 가치(완전희석)</small><b>$${ps.toFixed(2)}</b></div><div><small>현재가 대비</small><b class="${ps>=P.abcl?'up':'down'}">${ps>=P.abcl?'+':''}${pct(ps,P.abcl).toFixed(0)}%</b></div>`}
['a1','a2','a3','a4','a5','a6'].forEach(i=>$('#'+i).oninput=calcA);
const AQ={'보수':[1,30,45,12,450,0.25],'기본':[1.5,40,60,10,350,0.5],'회사 상단':[2,45,70,9,350,1],'현재가 수준':[3,45,70,9,350,2]};
$('#abq').innerHTML=Object.keys(AQ).map(k=>`<button data-k="${k}">${k}</button>`).join('');
[...$('#abq').children].forEach(b=>b.onclick=()=>{AQ[b.dataset.k].forEach((v,i)=>$('#a'+(i+1)).value=v);calcA()});
calcA();
(function(){const mkt=P.abcl*AB.fd,base=rnpv(1.5,.4,.6,.10,350),implied=mkt-AB.cash-base;let pk=0.5;while(pk<10&&rnpv(pk,.4,.6,.10,350)<mkt-AB.cash)pk+=0.05;
  $('#abimp').innerHTML=`<li><span class="i">1</span><span class="x">기본 가정의 ABCL635 가치<small>피크 $1.5B · 이익률 40% · 성공 60% · 할인 10%</small></span><span class="r">${fmtB(base)}</span></li>
  <li><span class="i">2</span><span class="x">시장이 나머지에 매기는 값<small>완전희석 시총 − 현금 − ABCL635. 후속 파이프라인·플랫폼·인수 기대</small></span><span class="r">${fmtB(implied)}</span></li>
  <li><span class="i">3</span><span class="x">ABCL635 하나로 현재가를 설명하려면 필요한 피크 매출<small>같은 조건, 기타 가치 0</small></span><span class="r">${pk>=10?'$10B+':'$'+pk.toFixed(1)+'B'}</span></li>`})();
function calcI(){const rev=+$('#b1').value,mul=+$('#b2').value,atm=+$('#b3').value;
  $('#p1').textContent='$'+rev+'M';$('#p2').textContent=mul.toFixed(1)+'x';$('#p3').textContent='$'+atm+'M';
  const sh=IO.sh+atm/P.iova,ps=(rev*mul+IO.cash+atm)/sh;
  $('#iout').innerHTML=`<div><small>기업가치</small><b>${fmtB(rev*mul)}</b></div><div><small>주식 수</small><b>${sh.toFixed(0)}M</b></div><div><small>주당 가치</small><b>$${ps.toFixed(2)}</b></div><div><small>현재가 대비</small><b class="${ps>=P.iova?'up':'down'}">${ps>=P.iova?'+':''}${pct(ps,P.iova).toFixed(0)}%</b></div>`}
['b1','b2','b3'].forEach(i=>$('#'+i).oninput=calcI);
const IQ={'보수':[520,5,250],'기본':[580,8,150],'낙관':[700,11,50]};
$('#ioq').innerHTML=Object.keys(IQ).map(k=>`<button data-k="${k}">${k}</button>`).join('');
[...$('#ioq').children].forEach(b=>b.onclick=()=>{IQ[b.dataset.k].forEach((v,i)=>$('#b'+(i+1)).value=v);calcI()});
calcI();
$('#ioimp').innerHTML=`<li><span class="i">1</span><span class="x">2026 가이던스 기준 EV/매출<small>중간값 $415M</small></span><span class="r">${(IO.ev/415).toFixed(1)}x</span></li>
  <li><span class="i">2</span><span class="x">8배를 정당화하려면 필요한 매출<small>성장이 둔화되면 통상 받는 배수</small></span><span class="r">${fmtB(IO.ev/8)}</span></li>
  <li><span class="i">3</span><span class="x">2Q 연환산 대비 필요한 성장<small>$397M 기준</small></span><span class="r">+${pct(IO.ev/8,397.2).toFixed(0)}%</span></li>`;

try{const r=localStorage.getItem('abiova-rng');if(r&&RANGES.some(x=>x[0]===r))RANGE=r}catch(e){}
let start='overview';try{const s=localStorage.getItem('abiova-view');if(s&&$('#v-'+s))start=s}catch(e){}
show(start);
})();
</script>
