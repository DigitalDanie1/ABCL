<title>ABCL × IOVA Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: SaaS research console. Fixed left sidebar + dense card grid; small headers, thin segment bars, ranked lists, green/red deltas. ABCL teal, IOVA orange. */
:root{
  --bg:#f6f6f7; --panel:#ffffff; --side:#fbfbfb; --line:#e6e6e9; --line2:#f1f1f3;
  --fg:#17171b; --fg2:#53545c; --muted:#8b8c94; --chip:#f2f2f4;
  --abcl:#0f9f8e; --iova:#e5780b; --up:#15a34a; --down:#dc2626; --warn:#c77700; --blue:#3866e0; --violet:#7c5cd6;
  --tip-bg:#17171b; --tip-fg:#ffffff;
  --f:'Geist','Noto Sans KR',system-ui,-apple-system,sans-serif;
  --fm:'Geist Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0f11; --panel:#16171a; --side:#121315; --line:#26272c; --line2:#1d1e22;
  --fg:#ececef; --fg2:#a8a9b1; --muted:#73747c; --chip:#212226;
  --abcl:#2cc5b1; --iova:#ff9a3a; --up:#2fd06b; --down:#ff6b6b; --warn:#f2b33d; --blue:#7ea0ff; --violet:#a68cff;
  --tip-bg:#ececef; --tip-fg:#16171a;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e0f11; --panel:#16171a; --side:#121315; --line:#26272c; --line2:#1d1e22;
  --fg:#ececef; --fg2:#a8a9b1; --muted:#73747c; --chip:#212226;
  --abcl:#2cc5b1; --iova:#ff9a3a; --up:#2fd06b; --down:#ff6b6b; --warn:#f2b33d; --blue:#7ea0ff; --violet:#a68cff;
  --tip-bg:#ececef; --tip-fg:#16171a;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 13px/1.55 var(--f);padding-inline:0;padding-block:0}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
.mono,.n{font-family:var(--fm);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:2px 8px;white-space:nowrap;flex:none}
.logo i{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--abcl),var(--iova));display:block}
.nav{display:grid;gap:2px}
.nav button{all:unset;display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--fg2);cursor:pointer;font-size:13px}
.nav button:hover{background:var(--chip);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--chip);color:var(--fg);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.nav svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.sgroup{font-size:11px;color:var(--muted);padding:0 10px;margin-bottom:4px;display:flex;justify-content:space-between}
.tk{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:8px;font-size:12.5px}
.tk b{display:flex;align-items:center;gap:7px}
.tk b::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.side .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:0 10px}
.main{min-width:0;padding:18px 24px 40px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
.asof{font-size:12px;color:var(--muted)}
.top .sp{flex:1}
.pillset{display:flex;gap:6px;flex-wrap:wrap}
.pillset span{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--fg2)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.s2{grid-column:span 2} .s3{grid-column:span 3}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.s3{grid-column:1/-1}}
@media(max-width:700px){.g4,.g3,.g2{grid-template-columns:minmax(0,1fr)}.s2,.s3{grid-column:auto}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ch h3{font-size:13px;font-weight:600;margin:0}
.ch .more{font-size:11.5px;color:var(--muted);white-space:nowrap}
section[hidden]{display:none}
.kpi{display:grid;gap:2px;min-width:0}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .v{font:500 20px/1.2 var(--fm);letter-spacing:-.01em}
.kpi .d{font-size:11.5px;color:var(--fg2)}
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 18px}
@media(max-width:560px){.kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.up{color:var(--up)} .down{color:var(--down)}
.delta{font:500 11px var(--fm);padding:1px 6px;border-radius:5px;background:var(--chip);white-space:nowrap}
.delta.up{background:color-mix(in srgb,var(--up) 12%,transparent)}
.delta.down{background:color-mix(in srgb,var(--down) 12%,transparent)}
.rl{list-style:none;margin:0;padding:0;display:grid}
.rl li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;padding:7px 0;border-top:1px solid var(--line2);align-items:start}
.rl li:first-child{border-top:0}
.rl .i{color:var(--muted);font:500 11.5px var(--fm);padding-top:1px}
.rl .x small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.rl .r{font:500 12px var(--fm);text-align:right;white-space:nowrap}
.segrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:12.5px;padding:3px 0}
.segrow .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:7px}
.seg{display:flex;height:6px;border-radius:99px;overflow:hidden;gap:2px;background:var(--line2)}
.seg i{display:block;height:100%;background:var(--c)}
.hb{display:grid;gap:8px}
.hbr{display:grid;grid-template-columns:120px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:12px}
.hbr .lb{color:var(--fg2)}
.hbr .tr{height:8px;background:var(--line2);border-radius:99px;position:relative}
.hbr .tr i{position:absolute;top:0;bottom:0;left:0;border-radius:99px;background:var(--c)}
.hbr .vv{font:500 12px var(--fm);text-align:right}
@media(max-width:520px){.hbr{grid-template-columns:90px minmax(0,1fr) 56px}}
.vbars{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:16px;border-bottom:1px solid var(--line)}
.vb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.vb i{display:block;width:100%;max-width:44px;border-radius:6px 6px 2px 2px;background:var(--c)}
.vb i.est{background:repeating-linear-gradient(135deg,var(--c) 0 4px,transparent 4px 7px);border:1px solid var(--c)}
.vb span{font:500 11.5px var(--fm)}
.vlab{display:flex;gap:14px}.vlab span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.wf{display:grid;gap:6px}
.wfr{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:12px}
.wfr .tr{height:14px;position:relative}
.wfr .tr i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--c)}
.wfr .vv{font:500 12px var(--fm);text-align:right}
@media(max-width:520px){.wfr{grid-template-columns:110px minmax(0,1fr) 60px}}
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}
th{font-weight:500;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:11.5px;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
.b{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--chip);color:var(--fg2);white-space:nowrap}
.b.ok{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent)}
.b.rep{color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.b.est{color:var(--violet);background:color-mix(in srgb,var(--violet) 12%,transparent)}
.b.mem{color:var(--muted)}
.b.unk{color:var(--down);background:color-mix(in srgb,var(--down) 10%,transparent)}
.b.clm{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.b.hi{color:var(--down);background:color-mix(in srgb,var(--down) 10%,transparent)}
.b.md{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.note{font-size:11.5px;color:var(--muted);margin:0}
p{margin:0}
.body{color:var(--fg2);font-size:12.5px}
.t{border-bottom:1px dotted var(--muted);cursor:help;position:relative;outline:none}
.t:hover::after,.t:focus::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 4px);z-index:30;width:max-content;max-width:240px;background:var(--tip-bg);color:var(--tip-fg);font:400 11.5px/1.45 var(--f);padding:6px 9px;border-radius:7px;white-space:normal;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.donut{width:120px;height:120px;border-radius:50%;flex:none;position:relative}
.donut::after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--panel)}
.dwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.rm{display:grid;grid-template-columns:28px repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(92px,auto)) 24px;gap:4px}
.rm .cell{border-radius:8px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;min-width:0}
.rm .ax{font-size:10.5px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.rm .ax.y{writing-mode:vertical-rl;transform:rotate(180deg)}
.rc{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--panel);border:1px solid var(--line);display:inline-flex;gap:5px;align-items:center}
.rc::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.ctl{display:grid;grid-template-columns:140px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:12px}
.ctl output{font:500 12px var(--fm);text-align:right}
input[type=range]{width:100%;accent-color:var(--c,var(--fg))}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.out div{background:var(--chip);border-radius:8px;padding:8px 10px}
.out small{display:block;font-size:11px;color:var(--muted)}
.out b{font:500 16px var(--fm)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns button{all:unset;font-size:11.5px;padding:3px 9px;border-radius:6px;border:1px solid var(--line);color:var(--fg2);cursor:pointer;background:var(--panel)}
.btns button:hover{color:var(--fg);border-color:var(--fg2)}
.btns button:focus-visible{outline:2px solid var(--blue)}
@media(max-width:520px){.ctl{grid-template-columns:1fr 64px}.ctl label{grid-column:1/-1}}
.tl{display:grid}
.tli{display:grid;grid-template-columns:96px 18px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line2);align-items:start}
.tli:first-child{border-top:0}
.tli .dt{font:500 11.5px var(--fm);color:var(--fg2)}
.tli .pin{width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:4px}
.tli b{font-weight:600}
.tli small{display:block;color:var(--muted);font-size:11.5px}
@media(max-width:560px){.tli{grid-template-columns:80px 14px minmax(0,1fr)}.tli>:last-child{grid-column:3}}
.quote{border-left:2px solid var(--c);padding:2px 0 2px 10px;color:var(--fg2);font-size:12.5px}
.quote small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.flt{display:flex;gap:6px;flex-wrap:wrap}
.flt button{all:unset;font-size:12px;padding:4px 11px;border-radius:99px;background:var(--chip);color:var(--fg2);cursor:pointer}
.flt button[aria-pressed="true"]{background:var(--fg);color:var(--panel)}
.flt button:focus-visible{outline:2px solid var(--blue)}
@media(max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:8px 16px;z-index:20;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;gap:10px;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .side .grp,.side .foot{display:none}
  .nav{display:flex;gap:2px}
  .nav button{white-space:nowrap;padding:6px 9px}
  .nav svg{display:none}
  .main{padding:14px 16px 32px}
}
</style>

<div class="app">
<aside class="side">
  <div class="logo"><i></i>Biotech Desk</div>
  <nav class="nav" id="nav"></nav>
  <div class="grp">
    <div class="sgroup"><span>워치리스트</span><span>9/30 종가</span></div>
    <div class="tk" style="--c:var(--abcl)"><b>ABCL</b><span class="n">$14.59</span></div>
    <div class="tk" style="--c:var(--iova)"><b>IOVA</b><span class="n">$14.82</span></div>
  </div>
  <div class="foot">KoreanDaniel · 투자 조언 아님<br>점선 밑줄 용어에 마우스를 올리면 설명</div>
</aside>

<main class="main">
  <div class="top">
    <h1>ABCL × IOVA 리서치</h1>
    <span class="asof">2026-09-30 종가 · 2Q26 10-Q · 2026-10-01 작성</span>
    <span class="sp"></span>
    <div class="pillset"><span><b class="b ok">확인</b> 공시·IR</span><span><b class="b rep">보도</b> 언론·집계</span><span><b class="b est">추정</b> 제 계산</span><span><b class="b clm">주장</b> 제3자</span><span><b class="b mem">기억</b> 재확인 필요</span></div>
  </div>
  <div id="views"></div>
</main>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const T=(word,tip)=>`<span class="t" tabindex="0" data-tip="${tip}">${word}</span>`;
const B=k=>({ok:'<b class="b ok">확인</b>',rep:'<b class="b rep">보도</b>',est:'<b class="b est">추정</b>',clm:'<b class="b clm">주장</b>',mem:'<b class="b mem">기억</b>',unk:'<b class="b unk">미확인</b>'})[k]||'';
const card=(title,more,body,cls='')=>`<div class="card ${cls}"><div class="ch"><h3>${title}</h3>${more?`<span class="more">${more}</span>`:''}</div>${body}</div>`;
const kpi=(l,v,d)=>`<div class="kpi"><span class="l">${l}</span><span class="v">${v}</span>${d?`<span class="d">${d}</span>`:''}</div>`;
const fmtB=v=>Math.abs(v)>=1000?(v<0?'-':'')+'$'+(Math.abs(v)/1000).toFixed(2)+'B':(v<0?'-':'')+'$'+Math.round(Math.abs(v))+'M';

const G={
 EV:T('EV','기업가치. 시가총액에서 순현금을 뺀 값. 현금 빼고 사업 자체가 얼마로 평가받는지'),
 FD:T('완전희석','스톡옵션·RSU·워런트가 모두 주식이 됐다고 가정한 주식 수'),
 RW:T('런웨이','지금 현금으로 추가 조달 없이 버틸 수 있는 기간'),
 ATM:T('ATM','At-the-market. 회사가 시장가로 조금씩 신주를 파는 방식의 증자'),
 PFW:T('사전납입 워런트','거의 0원에 주식으로 바꿀 수 있는 권리. 사실상 주식이라 주식 수에 포함'),
 RNPV:T('rNPV','위험조정 순현재가치. 미래 이익을 성공 확률과 시간가치로 할인한 값'),
 POS:T('성공 확률','3상 개시부터 승인까지 성공할 확률(PoS)'),
 ORR:T('ORR','객관적 반응률. 종양이 의미 있게 줄어든 환자 비율'),
 DOR:T('mDOR','반응 지속기간 중앙값. 줄어든 종양이 다시 커지기까지 걸린 기간'),
 WAC:T('WAC','도매 공시가(정가). 실제 순가격은 이보다 낮을 수 있음'),
 SBLA:T('sBLA','이미 승인된 약의 적응증 추가 신청'),
 MAA:T('MAA','유럽(EMA) 판매허가 신청'),
 EVS:T('EV/매출','기업가치가 연매출의 몇 배인지. 성장주의 대표 밸류 지표'),
 SI:T('공매도 비율','유통주식 중 공매도된 비율. 높으면 하락 베팅이 많고, 호재 때 숏커버 급등 가능성도 큼'),
 VMS:T('VMS','혈관운동증상. 폐경기 안면홍조·식은땀'),
 NK3:T('NK3R','뇌의 체온 조절 회로에 있는 수용체. 막으면 안면홍조가 줄어듦'),
 PBO:T('위약','약효 비교용 가짜약'),
 MIDD:T('MIDD','FDA 모델 기반 개발 프로그램. 용량·시험설계를 모델링으로 FDA와 미리 협의'),
 TCE:T('T세포 인게이저','T세포와 암세포를 동시에 붙잡아 면역세포가 암을 공격하게 하는 다중특이 항체'),
 ATC:T('ATC','Amtagvi 투여가 승인된 치료센터'),
 GM:T('매출총이익률','매출에서 제조원가를 뺀 비율'),
 DTC:T('days to cover','공매도 물량을 하루 평균 거래량으로 되사는 데 걸리는 일수'),
};

const P={abcl:14.59,iova:14.82};
const AB={sh0:306.47,offer:17.436,pfw:3.077,opt1:[21.2,1.18],opt2:[45.1,6.53],rsu:9.8,cash630:565.1,offerNet:187,vertex:28,q3burn:50,gov:110};
AB.basic=AB.sh0+AB.offer+AB.pfw;
AB.tsm=AB.opt1[0]+AB.opt2[0]+AB.rsu-(AB.opt1[0]*AB.opt1[1]+AB.opt2[0]*AB.opt2[1])/P.abcl;
AB.fd=AB.basic+AB.tsm;
AB.cash=AB.cash630+AB.offerNet+AB.vertex-AB.q3burn;
AB.cap=AB.basic*P.abcl; AB.ev=AB.cap-AB.cash; AB.fdcap=AB.fd*P.abcl;
const IO={sh:452.97,cash:303.7,rev26:415,h1:170.743};

  <li><span class="i">3</span><span class="x">ABCL 9/30 현금<small>$565.1M + 증자 순수입 ~$187M + Vertex $28M − 3Q 소진 ~$50M ≈ ${fmtB(AB.cash)}</small></span><span class="r"></span></li>
  <li><span class="i">4</span><span class="x">ABCL 런웨이<small>(현금+지원금) ÷ 연 소진. 3상 없이 $200M/년 → 4.2년, 3상 포함 ~$315M/년 → 2.7년</small></span><span class="r"></span></li>
  <li><span class="i">5</span><span class="x">IOVA EV<small>452.97M × $14.82 − $303.7M(6/30). 3분기 소진·ATM 미반영</small></span><span class="r"></span></li>
  <li><span class="i">6</span><span class="x">IOVA 하반기 필요 매출<small>$415M − 상반기 $170.7M = $244.3M → 분기 평균 $122M</small></span><span class="r"></span></li>
  <li><span class="i">7</span><span class="x">한계<small>9/30 이후 공시 미반영. 3분기 실제 현금은 11월 실적에서 확인 필요</small></span><span class="r"></span></li>
 </ol>`)}
</div>`]);

/* ---------- render ---------- */
const nav=$('#nav'), views=$('#views');
V.forEach(([id,label,ic,fn])=>{
  const b=document.createElement('button');b.innerHTML=`<svg viewBox="0 0 24 24">${ICON[ic]}</svg>${label}`;b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b);
  const s=document.createElement('section');s.id='v-'+id;s.hidden=true;s.innerHTML=fn();views.appendChild(s);
});
function show(id){
  V.forEach(([v])=>{$('#v-'+v).hidden=v!==id});
  [...nav.children].forEach(b=>{if(b.dataset.id===id)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  try{localStorage.setItem('abiova-view',id)}catch(e){}
  window.scrollTo(0,0);
}

let cf='all';
function renderCal(){
  $('#cf').innerHTML=[['all','전체'],['a','ABCL'],['i','IOVA']].map(f=>`<button aria-pressed="${cf===f[0]}" data-f="${f[0]}">${f[1]}</button>`).join('');
  [...$('#cf').children].forEach(b=>b.onclick=()=>{cf=b.dataset.f;renderCal()});
  $('#tl').innerHTML=CAL.filter(c=>cf==='all'||c.tk===cf).map(tlRow).join('');
}
renderCal();

function rnpv(peak,m,pos,r,ph3){
  let v=0,cost=0;const tax=.15,t0=2026.75;
  for(let y=2027;y<=2029;y++)cost+=ph3/3/Math.pow(1+r,y+.5-t0);
  for(let y=2030;y<=2041;y++){const ramp=Math.min(1,(y-2029)*.2);v+=peak*1000*ramp*m*(1-tax)/Math.pow(1+r,y+.5-t0)}
  return v*pos-cost;
}
function calcA(){
  const peak=+$('#a1').value,m=+$('#a2').value/100,pos=+$('#a3').value/100,r=+$('#a4').value/100,ph3=+$('#a5').value,oth=+$('#a6').value*1000;
  $('#o1').textContent='$'+peak.toFixed(1)+'B';$('#o2').textContent=Math.round(m*100)+'%';$('#o3').textContent=Math.round(pos*100)+'%';$('#o4').textContent=Math.round(r*100)+'%';$('#o5').textContent='$'+ph3+'M';$('#o6').textContent='$'+(oth/1000).toFixed(2)+'B';
  const x=rnpv(peak,m,pos,r,ph3),ps=(x+AB.cash+oth)/AB.fd;
  $('#aout').innerHTML=`<div><small>ABCL635 rNPV</small><b>${fmtB(x)}</b></div><div><small>+ 현금 + 기타</small><b>${fmtB(AB.cash+oth)}</b></div><div><small>주당 가치(완전희석)</small><b>$${ps.toFixed(2)}</b></div><div><small>현재가 대비</small><b class="${ps>=P.abcl?'up':'down'}">${ps>=P.abcl?'+':''}${((ps/P.abcl-1)*100).toFixed(0)}%</b></div>`;
}
['a1','a2','a3','a4','a5','a6'].forEach(i=>$('#'+i).oninput=calcA);
const AQ={'보수':[1,30,45,12,450,0.25],'기본':[1.5,40,60,10,350,0.5],'회사 상단':[2,45,70,9,350,1],'현재가 수준':[3,45,70,9,350,2]};
$('#abq').innerHTML=Object.keys(AQ).map(k=>`<button data-k="${k}">${k}</button>`).join('');
[...$('#abq').children].forEach(b=>b.onclick=()=>{AQ[b.dataset.k].forEach((v,i)=>$('#a'+(i+1)).value=v);calcA()});
calcA();
(function(){
  const mkt=P.abcl*AB.fd, base=rnpv(1.5,.4,.6,.10,350), implied=mkt-AB.cash-base;
  let pk=0.5;while(pk<10&&rnpv(pk,.4,.6,.10,350)<mkt-AB.cash)pk+=0.05;
  $('#abimp').innerHTML=`<li><span class="i">1</span><span class="x">기본 가정의 ABCL635 가치<small>피크 $1.5B · 이익률 40% · 성공 60% · 할인 10%</small></span><span class="r">${fmtB(base)}</span></li>
  <li><span class="i">2</span><span class="x">시장이 나머지에 매기는 값<small>완전희석 시총 − 현금 − ABCL635. 후속 파이프라인·플랫폼·인수 기대</small></span><span class="r">${fmtB(implied)}</span></li>
  <li><span class="i">3</span><span class="x">ABCL635 하나로 현재가를 설명하려면 필요한 피크 매출<small>같은 조건, 기타 가치 0</small></span><span class="r">${pk>=10?'$10B+':'$'+pk.toFixed(1)+'B'}</span></li>`;
})();

function calcI(){
  const rev=+$('#b1').value,mul=+$('#b2').value,atm=+$('#b3').value;
  $('#p1').textContent='$'+rev+'M';$('#p2').textContent=mul.toFixed(1)+'x';$('#p3').textContent='$'+atm+'M';
  const sh=IO.sh+atm/P.iova,ps=(rev*mul+IO.cash+atm)/sh;
  $('#iout').innerHTML=`<div><small>기업가치</small><b>${fmtB(rev*mul)}</b></div><div><small>주식 수</small><b>${sh.toFixed(0)}M</b></div><div><small>주당 가치</small><b>$${ps.toFixed(2)}</b></div><div><small>현재가 대비</small><b class="${ps>=P.iova?'up':'down'}">${ps>=P.iova?'+':''}${((ps/P.iova-1)*100).toFixed(0)}%</b></div>`;
}
['b1','b2','b3'].forEach(i=>$('#'+i).oninput=calcI);
const IQ={'보수':[520,5,250],'기본':[580,8,150],'낙관':[700,11,50]};
$('#ioq').innerHTML=Object.keys(IQ).map(k=>`<button data-k="${k}">${k}</button>`).join('');
[...$('#ioq').children].forEach(b=>b.onclick=()=>{IQ[b.dataset.k].forEach((v,i)=>$('#b'+(i+1)).value=v);calcI()});
calcI();
$('#ioimp').innerHTML=`<li><span class="i">1</span><span class="x">2026 가이던스 기준 EV/매출<small>중간값 $415M</small></span><span class="r">${(IO.ev/415).toFixed(1)}x</span></li>
  <li><span class="i">2</span><span class="x">8배를 정당화하려면 필요한 매출<small>성장이 둔화되면 통상 받는 배수</small></span><span class="r">${fmtB(IO.ev/8)}</span></li>
  <li><span class="i">3</span><span class="x">2Q 연환산 대비 필요한 성장<small>$397M 기준</small></span><span class="r">+${((IO.ev/8/397.2-1)*100).toFixed(0)}%</span></li>`;

let start='overview';try{const s=localStorage.getItem('abiova-view');if(s&&$('#v-'+s))start=s}catch(e){}
show(start);
})();
</script>
